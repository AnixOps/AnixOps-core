[package]
name = "mesh-node"
version.workspace = true
edition.workspace = true
# File::try_lock (the takeover lock) is stable from 1.89.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
description = "Standalone intranet mesh node: deployment subcommands (detect, import, takeover, rollback) shared by the Agent and the installers."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
# Contract tests: every configuration the importer writes must pass the mesh
# module's own validation.
outbound-mesh = { path = "../../crates/outbound-mesh" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "anixops-mesh"
path = "src/main.rs"
