[package]
name = "mesh-node"
version.workspace = true
edition.workspace = true
# File::try_lock (the takeover lock) is stable from 1.89.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
description = "Standalone intranet mesh node: the node itself (run) and the deployment subcommands (detect, import, takeover, rollback) shared by the Agent and the installers."

[dependencies]
# The node: configuration, protocol and socket driver.
outbound-mesh = { path = "../../crates/outbound-mesh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
# `run`: system randomness for the node identity (already used by the mesh
# module), and the TUN interface, signals and the driver's runtime.
ring = "0.17"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "signal", "io-util"] }
# `enroll`, `device`, `subnet-request`: HTTPS to Control, verified against
# the built-in public roots (a static binary has no system store) or the
# operator's own CA file.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.8"

[target.'cfg(windows)'.dependencies]
# `run`: the Wintun adapter.
platform-windows = { path = "../../crates/platform-windows" }
windows-sys = { version = "0.61.2", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_Networking_WinSock",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Services",
  "Win32_System_Threading",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "anixops-mesh"
path = "src/main.rs"
