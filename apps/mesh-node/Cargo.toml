[package]
name = "mesh-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone intranet mesh node: deployment subcommands (detect, import, takeover, rollback) shared by the Agent and the installers."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
# Contract tests: every configuration the importer writes must pass the mesh
# module's own validation.
outbound-mesh = { path = "../../crates/outbound-mesh" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "anixops-mesh"
path = "src/main.rs"
