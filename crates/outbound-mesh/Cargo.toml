[package]
name = "outbound-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional intranet mesh networking: written only from docs/protocols/intranet-mesh.md, intranet-only by construction."

[dependencies]
# Static keys in the config and the status (standard Base64); already used
# by the rest of the kernel.
base64 = "0.22"
# AEADs, HMAC and HKDF; already used by the rest of the kernel.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
# The opaque `params` of backbone links (`backbone::config`); already used
# by the rest of the kernel.
serde_json = "1"
# X25519 for the secure handshake; already used by the rest of the kernel.
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# Wipes root, traffic and handshake keys when they are dropped (MIT or
# Apache-2.0); already in the lock file through x25519-dalek.
zeroize = "1"
# zstd payloads from peers (spec §7.4); pure Rust, MIT. Already used by
# engine-embedded.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
# The `runtime` driver: sockets and timers. Already used by the rest of the
# kernel.
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"], optional = true }

[features]
default = ["runtime"]
# The socket driver (`driver`); without it the crate has no I/O at all.
runtime = ["dep:tokio"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[lib]
path = "src/lib.rs"
