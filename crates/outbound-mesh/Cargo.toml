[package]
name = "outbound-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional intranet mesh networking: written only from docs/protocols/intranet-mesh.md, intranet-only by construction."

[dependencies]
# AEADs, HMAC and HKDF; already used by the rest of the kernel.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
# X25519 for the secure handshake; already used by the rest of the kernel.
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# Wipes root, traffic and handshake keys when they are dropped (MIT or
# Apache-2.0); already in the lock file through x25519-dalek.
zeroize = "1"

[dev-dependencies]
serde_json = "1"

[lib]
path = "src/lib.rs"
