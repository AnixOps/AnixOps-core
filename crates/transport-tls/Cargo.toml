[package]
name = "transport-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Standard TLS client transport (rustls, WebPKI roots) shared by outbound protocol crates."

[dependencies]
engine-outbound = { path = "../engine-outbound" }
# SHA-256 of the server certificate for certificate pins.
ring = "0.17"
# The resumption counters as JSON for outbound reuse stats.
serde_json = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The warning for clients that accept any certificate.
tracing = { version = "0.1", default-features = false, features = ["std"] }
webpki-roots = "1.0.8"

[dev-dependencies]
rcgen = "0.14.8"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lib]
path = "src/lib.rs"
