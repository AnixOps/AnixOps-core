[package]
name = "inbound-socks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SOCKS5 server inbound for internal networks: username and password required, CONNECT only."

[dependencies]
engine-inbound = { path = "../engine-inbound" }
engine-outbound = { path = "../engine-outbound" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["io-util", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lib]
path = "src/lib.rs"
