name: Core 0.3.1 rehearsal artifact

on:
  push:
    branches: [rehearsal/core-031-ff2eea5]
    paths: [.github/workflows/core-031-rehearsal-artifact.yml]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ff2eea573db82de904fa32e0669b290b665a723c
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ff2eea573db82de904fa32e0669b290b665a723c
          persist-credentials: false
      - name: Build and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $actual = git rev-parse HEAD
          if ($actual -cne $env:CANDIDATE_SHA) { throw "Unexpected checkout: $actual" }
          rustup toolchain install stable --profile minimal
          $target = 'x86_64-pc-windows-msvc'
          cargo +stable build --locked --release -p mesh-node --bin anixops-mesh --target $target
          $output = New-Item -ItemType Directory -Path rehearsal-artifact
          Copy-Item "target/$target/release/anixops-mesh.exe" $output
          $binary = Join-Path $output.FullName 'anixops-mesh.exe'
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          "$digest *anixops-mesh.exe" | Set-Content (Join-Path $output.FullName 'SHA256SUMS') -Encoding ascii
          [ordered]@{
            commit_sha = $actual
            workflow_commit_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            target = $target
            version = (& $binary version)
            rustc = (rustc +stable -Vv) -join "`n"
            cargo = (cargo +stable -V)
            sha256 = $digest
          } | ConvertTo-Json | Set-Content (Join-Path $output.FullName 'buildinfo.json') -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-031-ff2eea5-windows-x64
          path: rehearsal-artifact/
          retention-days: 7
          if-no-files-found: error
