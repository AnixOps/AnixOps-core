name: Artifact Cleanup

# Artifacts only carry files between the jobs of one run (releases keep their
# own assets), so anything older than a day is deleted to keep Actions storage
# small.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete artifacts older than one day
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/artifact-cleanup.sh
